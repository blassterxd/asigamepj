services:
  web:
    build: .
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT1}:80"
    environment:
      GAME_SERVER_HOST: gameserver
      GAME_SERVER_PORT: ${GAME_SERVER_INTERNAL_PORT:-5000}
      CONTENT_HOST: sicontent
      CONTENT_PORT: 5000
    depends_on:
      - gameserver
      - sicontent
    restart: unless-stopped

  # Игровой сервер (комнаты). Образ задаётся в .env: GAME_SERVER_IMAGE=...
  gameserver:
    image: ${GAME_SERVER_IMAGE}
    expose:
      - "${GAME_SERVER_INTERNAL_PORT:-5000}"
    restart: unless-stopped

  # Сервис контента (картинки, аватарки)
  sicontent:
    image: vladimirkhil/sicontentservice:1.0.15
    expose:
      - "5000"
    volumes:
      - sicontent-data:/data
    restart: unless-stopped

volumes:
  sicontent-data:
