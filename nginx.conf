server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

     location /api/ {
        proxy_pass https://vladimirkhil.com;
        proxy_ssl_server_name on;
        proxy_set_header Host vladimirkhil.com;
        proxy_set_header Origin https://vladimirkhil.com;
        proxy_set_header Referer https://vladimirkhil.com/;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    location /sistatistics/ {
        proxy_pass https://vladimirkhil.com;
        proxy_ssl_server_name on;
        proxy_set_header Host vladimirkhil.com;
        proxy_set_header Origin https://sigame.vladimirkhil.com;
    }

    location /appregistry/ {
        proxy_pass https://vladimirkhil.com;
        proxy_ssl_server_name on;
        proxy_set_header Host vladimirkhil.com;
        proxy_set_header Origin https://sigame.vladimirkhil.com;
    }
}
