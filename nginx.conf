server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Прокси для списка серверов + подмена адреса игрового сервера на локальный прокси
    location /api/ {
        proxy_pass https://vladimirkhil.com;
        proxy_ssl_server_name on;
        proxy_ssl_name vladimirkhil.com;
        proxy_set_header Host vladimirkhil.com;
        proxy_set_header Origin https://vladimirkhil.com;
        proxy_set_header Accept-Encoding "";

        sub_filter 'https://vladimirkhil.com' '$scheme://$http_host/content';
        sub_filter 'https://vladimirkhil.com' '$scheme://$http_host/proxy2';
        sub_filter_once off;
        sub_filter_types application/json text/plain;

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    # 2. Прокси для игрового сервера ://vladimirkhil.com (API + WebSockets)
    location /content/ {
        proxy_pass https://vladimirkhil.com/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_server_name on;
        proxy_ssl_name ://vladimirkhil.com;
        proxy_set_header Host ://vladimirkhil.com;
        proxy_set_header Origin https://vladimirkhil.com;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    # 3. Прокси для резервного сервера server2
    location /proxy2/ {
        proxy_pass https://vladimirkhil.com/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_server_name on;
        proxy_ssl_name ://vladimirkhil.com;
        proxy_set_header Host ://vladimirkhil.com;
        proxy_set_header Origin https://vladimirkhil.com;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    location /sistatistics/ {
        proxy_pass https://vladimirkhil.com;
        proxy_ssl_server_name on;
        proxy_set_header Host vladimirkhil.com;
        proxy_set_header Origin https://vladimirkhil.com;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    location /appregistry/ {
        proxy_pass https://vladimirkhil.com;
        proxy_ssl_server_name on;
        proxy_set_header Host vladimirkhil.com;
        proxy_set_header Origin https://vladimirkhil.com;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
