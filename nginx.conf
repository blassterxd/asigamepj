server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Прокси для поиска серверов
    location /api/ {
        proxy_pass https://vladimirkhil.com;
        proxy_ssl_server_name on;
        proxy_ssl_name vladimirkhil.com;
        proxy_set_header Host vladimirkhil.com;
        proxy_set_header Origin https://vladimirkhil.com;
        proxy_set_header Referer https://vladimirkhil.com/;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    location /sistatistics/ {
        proxy_pass https://vladimirkhil.com;
        proxy_ssl_server_name on;
        proxy_ssl_name vladimirkhil.com;
        proxy_set_header Host vladimirkhil.com;
        proxy_set_header Origin https://vladimirkhil.com;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    location /appregistry/ {
        proxy_pass https://vladimirkhil.com;
        proxy_ssl_server_name on;
        proxy_ssl_name vladimirkhil.com;
        proxy_set_header Host vladimirkhil.com;
        proxy_set_header Origin https://vladimirkhil.com;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    # Прокси для игрового сервера (SignalR / WebSockets)
    location /sionline {
        proxy_pass https://vladimirkhil.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_server_name on;
        proxy_ssl_name ://vladimirkhil.com;
        proxy_set_header Host ://vladimirkhil.com;
        proxy_set_header Origin https://vladimirkhil.com;
    }

    # Раздача самой игры
    location / {
        try_files $uri $uri/ /index.html;
    }
}
