server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver 8.8.8.8 valid=30s;

    set $base_domain "vladimirkhil.com";
    set $game_host "content.${base_domain}";
    set $proxy_host_name "server2.${base_domain}";

    location = /api/si/servers {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '[{"uri":"/content","proxyUri":"/proxy2","protocolVersion":1}]';
    }

    location /content/ {
        rewrite ^/content/(.*)$ /$1 break;
        proxy_pass https://$game_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_server_name on;
        proxy_ssl_name $game_host;
        proxy_set_header Host $game_host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    location /proxy2/ {
        rewrite ^/proxy2/(.*)$ /$1 break;
        proxy_pass https://$proxy_host_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host_name;
        proxy_set_header Host $proxy_host_name;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
